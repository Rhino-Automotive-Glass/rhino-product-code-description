name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    # Tests run against a throwaway local Supabase in Docker, loaded from
    # supabase/e2e/*.sql — never the production project, and no secrets needed.
    - uses: supabase/setup-cli@v1
      with:
        version: latest

    # Loads the baseline schema, then applies every migration the baseline does
    # not already contain (supabase/e2e/migrations-in-schema.txt). A migration
    # that fails here fails the pull request instead of the deploy.
    - name: Start local Supabase, load baseline schema and apply pending migrations
      run: npm run e2e:db

    - name: Check migration runner selection rules
      run: bash supabase/tests/migration_runner.sh

    - name: Assert pending migrations were applied
      run: |
        DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
        psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/pending_migrations_applied.sql

    - name: Run Playwright tests
      run: npm run test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Stop local Supabase
      if: ${{ always() }}
      run: supabase stop --no-backup
